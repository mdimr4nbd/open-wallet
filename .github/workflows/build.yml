name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare folders
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png
          cp splash.png assets/splash.png
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Remove splash screen completely
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/drawable
          cat > android/app/src/main/res/values/ow_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ow_bg">#06090e</color>
          </resources>
          XML
          cat > android/app/src/main/res/drawable/ow_transparent.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#00000000" />
          </shape>
          XML
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(m):
              head, name, body, tail = m.group(1), m.group(2), m.group(3), m.group(4)
              body = re.sub(r'\s*<item name="android:windowBackground">.*?</item>', '', body)
              body = re.sub(r'\s*<item name="android:background">@drawable/splash</item>', '', body)
              items = '\n        <item name="android:windowBackground">@color/ow_bg</item>'
              items += '\n        <item name="android:colorBackground">@color/ow_bg</item>'
              items += '\n        <item name="android:windowSplashScreenBackground">@color/ow_bg</item>'
              items += '\n        <item name="android:windowSplashScreenAnimatedIcon">@drawable/ow_transparent</item>'
              if 'SplashScreen' in head:
                  items += '\n        <item name="windowSplashScreenBackground">@color/ow_bg</item>'
                  items += '\n        <item name="windowSplashScreenAnimatedIcon">@drawable/ow_transparent</item>'
              return head + body + items + '\n    ' + tail
          s = re.sub(r'(<style name="(AppTheme\.NoActionBar(?:Launch)?)"[^>]*>)(.*?)(</style>)', fix, s, flags=re.S)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OpenWallet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: OpenWallet v${{ github.run_number }}
          files: OpenWallet.apk
