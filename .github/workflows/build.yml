name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare folders
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png
          cp splash.png assets/splash.png
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OpenWallet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: OpenWallet v${{ github.run_number }}
          files: OpenWallet.apk
